<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"></head><body>
<title>DE kitazo! 全問チェック</title>
<style>
  :root { --bg:#fff7ec; --card:#fff; --ink:#2b2118; --muted:#8a7a6a; --line:#f1e3cf; --accent:#ff8a00; --accent-soft:#ffe6c2; --ok:#19a974; --ok-soft:#d9f6e8; --ng:#e5484d; --ng-soft:#ffe0e1; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1612; --card:#26201a; --ink:#f6efe6; --muted:#b3a390; --line:#3a3028; --accent:#ff9a1f; --accent-soft:#4a3415; --ok:#3ad48f; --ok-soft:#173b2c; --ng:#ff6b6f; --ng-soft:#4a1f22; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg:#1b1612; --card:#26201a; --ink:#f6efe6; --muted:#b3a390; --line:#3a3028; --accent:#ff9a1f; --accent-soft:#4a3415; --ok:#3ad48f; --ok-soft:#173b2c; --ng:#ff6b6f; --ng-soft:#4a1f22; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", Meiryo, sans-serif; font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 8px 40px; padding-inline: 16px; }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding: 6px 0 8px; border-bottom: 1px solid var(--line); }
  .logo { font-weight: 900; font-style: italic; color: var(--accent); font-size: 18px; font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .logo small { font-style: normal; color: var(--muted); font-weight: 600; font-size: 12px; margin-left: 6px; font-family: inherit; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); flex: 1; min-width: 0; }
  .nav { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 700; cursor: pointer; }
  #filters { display: flex; gap: 6px; margin-top: 6px; }
  #filters button, #open-all { border: 1.5px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  #filters button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .muted { color: var(--muted); font-size: 12px; }
  #stat { font-size: 13px; margin-top: 4px; }
  .qc { background: var(--card); border-radius: 16px; padding: 14px; margin-top: 12px; border: 2px solid transparent; box-shadow: 0 2px 10px rgba(80,50,10,.08); }
  .qc.changed { border-color: var(--accent); }
  .qc.done { opacity: .85; }
  .qh { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .qid { font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
  .lv { font-size: 12px; color: var(--muted); }
  .badge { font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 8px; font-weight: 700; }
  .badge.note { background: var(--ok-soft); color: var(--ok); }
  .qc.done .qh::after { content: "✅ 確認済み"; font-size: 12px; color: var(--ok); margin-left: auto; }
  .fig { display: block; width: 100%; max-width: 320px; border-radius: 10px; background: #fff; margin-bottom: 8px; }
  .qtext { font-weight: 700; font-size: 16px; }
  .chs { display: grid; gap: 6px; margin-top: 10px; }
  .ch { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 9px 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .ch .k { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 900; font-size: 12px; display: grid; place-items: center; }
  .ch.ok { border-color: var(--ok); background: var(--ok-soft); } .ch.ng { border-color: var(--ng); background: var(--ng-soft); } .ch.dim { opacity: .45; }
  .verd { display: grid; gap: 8px; margin-top: 10px; }
  .vbox { border-radius: 12px; padding: 10px 12px; font-weight: 700; }
  .vbox.ok { background: var(--ok-soft); color: var(--ok); } .vbox.ng { background: var(--ng-soft); color: var(--ng); }
  .vh { font-size: 12px; font-weight: 700; opacity: .8; margin-bottom: 4px; }
  .vexp { font-weight: 500; color: var(--ink); font-size: 14px; margin-top: 4px; white-space: pre-line; }
  .lnk { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; font-weight: 700; padding: 8px 0 0; cursor: pointer; }
  .rev { background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-top: 6px; font-size: 14px; }
  .rev ol { margin: 4px 0 0; padding-left: 20px; white-space: pre-line; } .rev li.ans { color: var(--ok); font-weight: 700; }
  details.edit { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  details.edit summary { cursor: pointer; font-weight: 700; color: var(--accent); }
  details.edit label { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin: 10px 0 4px; }
  .f { width: 100%; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  .f:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .drow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  @media (max-width: 480px) { .drow { grid-template-columns: 1fr; } }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; margin: 0; color: var(--ink); }
  .btn { margin-left: auto; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 800; border-radius: 12px; padding: 10px 18px; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 50; }
  .intro { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
</style>
<div class="wrap">
  <div class="top">
    <div class="row"><div class="logo">DE kitazo!<small>先生用 全問チェック</small></div><a id="to-status" href="status.html" hidden style="margin-left:auto;color:var(--accent);font-size:12px;font-weight:700;text-decoration:none">生徒の状況 ›</a></div>
    <div class="row" style="margin-top:6px">
      <button class="nav" id="prev">‹</button>
      <select id="unit-select"></select>
      <button class="nav" id="next">›</button>
    </div>
    <div id="filters"><button data-f="all">全部</button><button data-f="unchecked">未確認</button><button data-f="changed">変更あり</button><button id="open-all">全部の表示を開く</button></div>
    <div id="stat"></div>
    <div class="muted" id="db-note"></div>
  </div>
  <p class="intro">選択肢を押すと、正解したときと間違えたときの表示が両方出ます。直したいときは「✏️ 直す」を開いて書き換えて「保存」。解説は正解・不正解どちらでも同じ文が出ます（不正解では 📖 付き）。</p>
  <div id="list"></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script>
  // サーバー（config.js の api）があればシートを直接直す。なければ data/*.js を読んでこの端末に控える
  (function () {
    var api = (window.DEKITAZO_CONFIG || {}).api;
    var list = api ? ["check.js"] : ["data/index.js", "data/rika3.js", "data/rekishi.js", "check.js"];
    (function next(i) { if (i >= list.length) return; var s = document.createElement("script"); s.src = list[i]; s.onload = function () { next(i + 1); }; document.body.appendChild(s); })(0);
  })();
</script>
</body></html>
