<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="sans-serif" font-size="14">
  <rect width="320" height="200" fill="#fff" rx="12"/>
  <!-- 机 -->
  <rect x="30" y="140" width="260" height="12" fill="#a1887f"/>
  <rect x="50" y="152" width="10" height="40" fill="#8d6e63"/><rect x="260" y="152" width="10" height="40" fill="#8d6e63"/>
  <!-- 本 -->
  <rect x="120" y="100" width="80" height="40" fill="#64b5f6" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="125" text-anchor="middle" fill="#0d47a1" font-weight="bold">本</text>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#e53935"/></marker>
        <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1e88e5"/></marker></defs>
  <!-- 重力 A: 本の中心から下 -->
  <line x1="160" y1="120" x2="160" y2="180" stroke="#e53935" stroke-width="3" marker-end="url(#ah)"/>
  <text x="170" y="178" fill="#e53935" font-weight="bold">A</text>
  <!-- 垂直抗力 B: 机から上 -->
  <line x1="200" y1="140" x2="200" y2="80" stroke="#1e88e5" stroke-width="3" marker-end="url(#ah2)"/>
  <text x="208" y="86" fill="#1e88e5" font-weight="bold">B</text>
  <text x="30" y="30" fill="#444">机の上で静止している本にはたらく力</text>
</svg>
