  <ellipse cx="110" cy="95" rx="32" ry="20" fill="#ffd84d" stroke="#d6a800" stroke-width="2" transform="rotate(-30 110 95)"/>
  <ellipse cx="210" cy="95" rx="32" ry="20" fill="#ffd84d" stroke="#d6a800" stroke-width="2" transform="rotate(30 210 95)"/>
  <!-- おしべ -->
  <g stroke="#7a5c00" stroke-width="2">
    <line x1="135" y1="120" x2="125" y2="70"/><line x1="185" y1="120" x2="195" y2="70"/>
    <line x1="145" y1="120" x2="140" y2="62"/><line x1="175" y1="120" x2="180" y2="62"/>
  </g>
  <g fill="#b8860b"><ellipse cx="125" cy="66" rx="5" ry="7"/><ellipse cx="195" cy="66" rx="5" ry="7"/><ellipse cx="140" cy="58" rx="5" ry="7"/><ellipse cx="180" cy="58" rx="5" ry="7"/></g>
  <!-- めしべ -->
  <rect x="156" y="60" width="8" height="62" fill="#9ccc65" stroke="#4e8a35" stroke-width="2"/>
  <ellipse cx="160" cy="56" rx="9" ry="6" fill="#cddc39" stroke="#4e8a35" stroke-width="2"/>
  <ellipse cx="160" cy="118" rx="12" ry="14" fill="#aed581" stroke="#4e8a35" stroke-width="2"/>
