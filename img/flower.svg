    <line x1="125" y1="66" x2="60" y2="40" stroke="#222"/><text x="40" y="44">イ</text>
    <line x1="238" y1="95" x2="280" y2="110" stroke="#222"/><text x="284" y="114">ウ</text>
    <line x1="195" y1="138" x2="250" y2="165" stroke="#222"/><text x="254" y="170">エ</text>
    <line x1="160" y1="128" x2="95" y2="170" stroke="#222"/><text x="76" y="176">オ</text>
